name: macOS

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "linux/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "linux/**"
      - "**.md"

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - name: Check build.sh syntax
        run: zsh -n build.sh
      - name: Release build
        run: swift build -c release
      - name: Tests
        run: swift test
